[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fine-tracing"
version = "1.0.0"
description = "Turn crack segmentation masks into measured centrelines: length, width along the crack, branches, gaps, overlays and scores."
readme = "README.md"
authors = [{ name = "Rami Kronbi" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
  "crack-detection",
  "crack-width",
  "skeletonization",
  "centerline",
  "infrastructure-inspection",
  "computer-vision",
  "opencv",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "opencv-python-headless>=4.6",
  "scikit-image>=0.21",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.5"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://ramikronbi.com/projects/fine-crack-tracing-toolkit"
Repository = "https://github.com/Kronbii/fine-crack-tracing"

[project.scripts]
fine-tracing = "fine_tracing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]
